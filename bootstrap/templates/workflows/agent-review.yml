{
  "name": "Independent exact-SHA Principal",
  "on": {
    "workflow_call": {
      "inputs": {
        "control_sha": {
          "type": "string",
          "required": true
        },
        "base_sha": {
          "type": "string",
          "required": true
        },
        "branch": {
          "type": "string",
          "required": true
        },
        "pr_number": {
          "type": "string",
          "required": true
        },
        "cycle": {
          "type": "number",
          "required": true
        },
        "prior_cycle": {
          "type": "number",
          "required": true
        }
      },
      "secrets": {
        "OPENAI_API_KEY": {
          "required": true
        }
      },
      "outputs": {
        "status": {
          "value": "${{ jobs.review.outputs.status }}"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "issues": "read",
    "pull-requests": "read",
    "checks": "read",
    "actions": "read"
  },
  "jobs": {
    "review": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "checks": "read",
        "actions": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "ISSUE_NUMBER": "7",
        "CONTROL_SHA": "${{ inputs.control_sha }}",
        "BASE_SHA": "${{ inputs.base_sha }}",
        "CYCLE": "${{ inputs.cycle }}",
        "BRANCH": "${{ inputs.branch }}",
        "PR_NUMBER": "${{ inputs.pr_number }}",
        "CANDIDATE": "${{ github.workspace }}",
        "ENABLED": "${{ vars.SAR_ORCHESTRATION_ENABLED }}",
        "AUTHORIZATION_ID": "${{ vars.SAR_AUTHORIZATION_COMMENT_ID }}"
      },
      "outputs": {
        "status": "${{ steps.review.outputs.status }}"
      },
      "steps": [
        {
          "name": "Initialize isolated run paths",
          "run": "echo \"RUN_DATA=$RUNNER_TEMP/run-data\" >> \"$GITHUB_ENV\"\necho \"ARTIFACT=$RUNNER_TEMP/patch-artifact\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Checkout immutable source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ inputs.control_sha }}",
            "persist-credentials": false,
            "fetch-depth": 0,
            "path": ".control"
          }
        },
        {
          "name": "Move trusted control outside candidate tree",
          "run": "mv \"$GITHUB_WORKSPACE/.control\" \"$RUNNER_TEMP/control\""
        },
        {
          "name": "CPython 3.14",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Fail-closed task budget admission",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/budget.py gate",
          "env": {
            "BUDGET_ROLE": "codex"
          }
        },
        {
          "name": "Revalidate current issue authorization and main control SHA",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/control.py gate"
        },
        {
          "name": "Checkout immutable source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ inputs.base_sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Wait for trusted CI on exact current candidate head",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/control.py wait-ci"
        },
        {
          "name": "Prior review for cumulative re-review",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "principal-review-${{ inputs.prior_cycle }}",
            "path": "${{ runner.temp }}/prior-review"
          },
          "if": "inputs.cycle > 0"
        },
        {
          "name": "Read-only Codex Principal review",
          "uses": "openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5",
          "with": {
            "openai-api-key": "${{ secrets.OPENAI_API_KEY }}",
            "permission-profile": ":read-only",
            "safety-strategy": "drop-sudo",
            "prompt-file": "${{ runner.temp }}/control/scripts/orchestration/reviewer-prompt.txt",
            "output-schema-file": "${{ runner.temp }}/control/scripts/orchestration/review-schema.json",
            "output-file": "${{ runner.temp }}/run-data/review.json"
          },
          "id": "codex"
        },
        {
          "name": "Validate exact-SHA disposition",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/control.py review",
          "id": "review"
        },
        {
          "name": "Validate and sanitize review artifact",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/control.py safe-review-artifact",
          "if": "always()"
        },
        {
          "name": "Upload structured review and CI evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "principal-review-${{ inputs.cycle }}",
            "path": "${{ runner.temp }}/patch-artifact/*.json",
            "retention-days": 14,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        },
        {
          "name": "Preserve safe diagnostics",
          "run": "python ${{ runner.temp }}/control/scripts/orchestration/control.py diagnostics",
          "if": "always()",
          "env": {
            "JOB_STATUS": "${{ job.status }}"
          }
        },
        {
          "name": "Upload safe diagnostics",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "reviewer-diagnostics-${{ inputs.cycle }}",
            "path": "${{ runner.temp }}/run-data/diagnostics.json",
            "retention-days": 14,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        },
        {
          "name": "Safe budget status evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "budget-codex-${{ inputs.cycle }}",
            "path": "${{ runner.temp }}/run-data/budget-report.json",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
