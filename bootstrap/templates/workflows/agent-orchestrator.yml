{
  "name": "SAR Agent Orchestrator",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "issue_number": {
          "description": "Approved GitHub issue number (currently 7 only)",
          "required": true,
          "type": "number"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "sar-agent-issue-${{ inputs.issue_number }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "authorize": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read",
        "issues": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "ISSUE_NUMBER": "${{ inputs.issue_number }}",
        "ENABLED": "${{ vars.SAR_ORCHESTRATION_ENABLED }}",
        "AUTHORIZATION_ID": "${{ vars.SAR_AUTHORIZATION_COMMENT_ID }}"
      },
      "outputs": {
        "control_sha": "${{ steps.gate.outputs.control_sha }}"
      },
      "steps": [
        {
          "name": "Initialize isolated run paths",
          "run": "echo \"RUN_DATA=$RUNNER_TEMP/run-data\" >> \"$GITHUB_ENV\"\necho \"ARTIFACT=$RUNNER_TEMP/patch-artifact\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Checkout immutable source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "CPython 3.14",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Fail-closed task budget admission",
          "run": "python scripts/orchestration/budget.py gate",
          "env": {
            "BUDGET_ROLE": "authorize"
          }
        },
        {
          "name": "Validate scope, approval, digest, governance and policy",
          "run": "python scripts/orchestration/control.py gate",
          "id": "gate"
        },
        {
          "name": "Safe diagnostic metadata",
          "run": "python scripts/orchestration/control.py diagnostics",
          "if": "always()",
          "env": {
            "JOB_STATUS": "${{ job.status }}"
          }
        },
        {
          "name": "Gate evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "authorization-diagnostics",
            "path": "${{ runner.temp }}/run-data/diagnostics.json",
            "retention-days": 14
          },
          "if": "always()"
        },
        {
          "name": "Safe budget status evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "budget-authorize-admission",
            "path": "${{ runner.temp }}/run-data/budget-report.json",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "build_0": {
      "needs": [
        "authorize"
      ],
      "if": "success()",
      "uses": "./.github/workflows/agent-build.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "id-token": "write"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.authorize.outputs.control_sha }}",
        "pr_number": "0",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 0,
        "prior_cycle": 0
      }
    },
    "publish_0": {
      "needs": [
        "authorize",
        "build_0"
      ],
      "if": "${{ always() && needs.build_0.result == 'success' }}",
      "uses": "./.github/workflows/agent-publish.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.authorize.outputs.control_sha }}",
        "pr_number": "0",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 0,
        "prior_cycle": 0
      },
      "secrets": {
        "SAR_AUTOMATION_TOKEN": "${{ secrets.SAR_AUTOMATION_TOKEN }}"
      }
    },
    "review_0": {
      "needs": [
        "authorize",
        "publish_0"
      ],
      "if": "${{ always() && needs.publish_0.result == 'success' }}",
      "uses": "./.github/workflows/agent-review.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "checks": "read",
        "actions": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_0.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 0,
        "prior_cycle": 0
      },
      "secrets": {
        "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
      }
    },
    "build_1": {
      "needs": [
        "authorize",
        "publish_0",
        "review_0"
      ],
      "if": "${{ always() && needs.authorize.result == 'success' && needs.review_0.result == 'success' && needs.review_0.outputs.status == 'BLOCKERS' }}",
      "uses": "./.github/workflows/agent-build.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "id-token": "write"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_0.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 1,
        "prior_cycle": 0
      }
    },
    "publish_1": {
      "needs": [
        "authorize",
        "build_1",
        "publish_0"
      ],
      "if": "${{ always() && needs.build_1.result == 'success' }}",
      "uses": "./.github/workflows/agent-publish.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_0.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 1,
        "prior_cycle": 0
      },
      "secrets": {
        "SAR_AUTOMATION_TOKEN": "${{ secrets.SAR_AUTOMATION_TOKEN }}"
      }
    },
    "review_1": {
      "needs": [
        "authorize",
        "publish_1"
      ],
      "if": "${{ always() && needs.publish_1.result == 'success' }}",
      "uses": "./.github/workflows/agent-review.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "checks": "read",
        "actions": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_1.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_1.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 1,
        "prior_cycle": 0
      },
      "secrets": {
        "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
      }
    },
    "build_2": {
      "needs": [
        "authorize",
        "publish_0",
        "publish_1",
        "review_1"
      ],
      "if": "${{ always() && needs.authorize.result == 'success' && needs.review_1.result == 'success' && needs.review_1.outputs.status == 'BLOCKERS' }}",
      "uses": "./.github/workflows/agent-build.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "id-token": "write"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_1.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 2,
        "prior_cycle": 1
      }
    },
    "publish_2": {
      "needs": [
        "authorize",
        "build_2",
        "publish_0",
        "publish_1"
      ],
      "if": "${{ always() && needs.build_2.result == 'success' }}",
      "uses": "./.github/workflows/agent-publish.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_1.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 2,
        "prior_cycle": 1
      },
      "secrets": {
        "SAR_AUTOMATION_TOKEN": "${{ secrets.SAR_AUTOMATION_TOKEN }}"
      }
    },
    "review_2": {
      "needs": [
        "authorize",
        "publish_2"
      ],
      "if": "${{ always() && needs.publish_2.result == 'success' }}",
      "uses": "./.github/workflows/agent-review.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "checks": "read",
        "actions": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_2.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_2.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 2,
        "prior_cycle": 1
      },
      "secrets": {
        "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
      }
    },
    "blocked": {
      "needs": [
        "authorize",
        "build_0",
        "publish_0",
        "review_0",
        "build_1",
        "publish_1",
        "review_1",
        "build_2",
        "publish_2",
        "review_2",
        "build_3",
        "publish_3",
        "review_3"
      ],
      "if": "${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read",
        "issues": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "ISSUE_NUMBER": "${{ inputs.issue_number }}",
        "RECORD_BLOCKED": "${{ vars.SAR_RECORD_BLOCKED }}",
        "JOB_STATUS": "failure"
      },
      "steps": [
        {
          "name": "Initialize isolated run paths",
          "run": "echo \"RUN_DATA=$RUNNER_TEMP/run-data\" >> \"$GITHUB_ENV\"\necho \"ARTIFACT=$RUNNER_TEMP/patch-artifact\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Checkout immutable source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "CPython 3.14",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Persist safe blocked metadata",
          "run": "python scripts/orchestration/control.py diagnostics"
        },
        {
          "name": "Blocked evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "blocked-state",
            "path": "${{ runner.temp }}/run-data/diagnostics.json",
            "retention-days": 14
          }
        },
        {
          "name": "Record blocked state only when separately authorized",
          "run": "python scripts/orchestration/control.py record-blocked",
          "if": "vars.SAR_RECORD_BLOCKED == 'true' && inputs.issue_number == 7"
        }
      ]
    },
    "build_3": {
      "needs": [
        "authorize",
        "publish_0",
        "publish_2",
        "review_2"
      ],
      "if": "${{ always() && needs.authorize.result == 'success' && needs.review_2.result == 'success' && needs.review_2.outputs.status == 'BLOCKERS' }}",
      "uses": "./.github/workflows/agent-build.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "id-token": "write"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_2.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 3,
        "prior_cycle": 2
      }
    },
    "publish_3": {
      "needs": [
        "authorize",
        "build_3",
        "publish_0",
        "publish_2"
      ],
      "if": "${{ always() && needs.build_3.result == 'success' }}",
      "uses": "./.github/workflows/agent-publish.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_2.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_0.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 3,
        "prior_cycle": 2
      },
      "secrets": {
        "SAR_AUTOMATION_TOKEN": "${{ secrets.SAR_AUTOMATION_TOKEN }}"
      }
    },
    "review_3": {
      "needs": [
        "authorize",
        "publish_3"
      ],
      "if": "${{ always() && needs.publish_3.result == 'success' }}",
      "uses": "./.github/workflows/agent-review.yml",
      "permissions": {
        "contents": "read",
        "issues": "read",
        "pull-requests": "read",
        "checks": "read",
        "actions": "read"
      },
      "with": {
        "control_sha": "${{ needs.authorize.outputs.control_sha }}",
        "base_sha": "${{ needs.publish_3.outputs.candidate_sha }}",
        "pr_number": "${{ needs.publish_3.outputs.pr_number }}",
        "branch": "codex/agent-issue-7-${{ github.run_id }}-${{ github.run_attempt }}",
        "cycle": 3,
        "prior_cycle": 2
      },
      "secrets": {
        "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
      }
    }
  }
}
