{
  "name": "CI",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "contracts": {
      "name": "Contracts and security (CPython 3.14 macOS)",
      "runs-on": "macos-15",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Initialize isolated run paths",
          "run": "echo \"RUN_DATA=$RUNNER_TEMP/run-data\" >> \"$GITHUB_ENV\"\necho \"ARTIFACT=$RUNNER_TEMP/patch-artifact\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Checkout immutable source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "CPython 3.14",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Reproducible stdlib contract/security evidence",
          "run": "mkdir -p \"$RUNNER_TEMP/evidence\"\npython - <<'PY' > \"$RUNNER_TEMP/evidence/environment.json\"\nimport json,platform,sys,os\nprint(json.dumps({'python':sys.version,'os':platform.platform(),'architecture':platform.machine(),'github_sha':os.environ['GITHUB_SHA']}))\nassert sys.version_info[:2] == (3,14)\nPY\nset +e\npython scripts/validate_governance.py > \"$RUNNER_TEMP/evidence/governance.txt\" 2>&1\ngov=$?\npython scripts/orchestration/control.py validate-tests > \"$RUNNER_TEMP/evidence/unittest.txt\" 2>&1\ntests=$?\nif [ \"$GITHUB_EVENT_NAME\" = pull_request ]; then\n  git diff --check \"$PR_BASE_SHA\" \"$PR_HEAD_SHA\" > \"$RUNNER_TEMP/evidence/whitespace.txt\" 2>&1\nelse\n  git diff --check HEAD^ HEAD > \"$RUNNER_TEMP/evidence/whitespace.txt\" 2>&1\nfi\nws=$?\nprintf '{\"governance_exit\":%s,\"unittest_exit\":%s,\"whitespace_exit\":%s}\\n' \"$gov\" \"$tests\" \"$ws\" > \"$RUNNER_TEMP/evidence/result.json\"\ntest \"$gov\" -eq 0 && test \"$tests\" -eq 0 && test \"$ws\" -eq 0",
          "env": {
            "PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD_SHA": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "Pass/fail evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ci-evidence-${{ github.sha }}",
            "path": "${{ runner.temp }}/evidence",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "if": "always()"
        }
      ]
    }
  }
}
